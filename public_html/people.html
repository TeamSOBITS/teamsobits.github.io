<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/people.css" />
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico" />
    <title data-lang-key="people-page.title"></title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="./index.html">
          <img
            src="./assets/images/logo.svg"
            alt="SOBITS logo"
            class="header-logo__image"
          />
        </a>
      </div>
      <nav class="header-nav">
        <a href="./index.html" data-lang-key="top"></a>
        <a href="./news.html" data-lang-key="news"></a>
        <a href="./about.html" data-lang-key="about"></a>
        <a href="./research.html" data-lang-key="research"></a>
        <a href="./robot.html" data-lang-key="robots"></a>
        <a href="./publication.html" data-lang-key="publications"></a>
        <a href="./people.html" data-lang-key="people"></a>
      </nav>
    </header>
    <main>
      <div class="people-page">
        <h1 data-lang-key="people"></h1>
        <section id="faculty">
          <h2 data-lang-key="faculties"></h2>
          <div id="faculty-list" class="people-list">
            <!-- The PersonCardMini will be injected here by JavaScript -->
            <template id="person-card-mini-template">
              <div class="person-card-mini">
                <div class="person-card-mini__avatar">
                  <img src="" />
                </div>
                <div class="person-card-mini__name"></div>
                <div class="person-card-mini__details">
                  <div class="person-card-mini__position"></div>
                  <div class="person-card-mini__lab"></div>
                </div>
              </div>
            </template>
          </div>
        </section>
        <section id="phd-students">
          <h2 data-lang-key="phd-students"></h2>
          <div id="phd-list" class="people-list">
            <!-- The PersonCardMini will be injected here by JavaScript -->
          </div>
        </section>
        <section id="master-students">
          <h2 data-lang-key="master-students"></h2>
          <div id="master-list" class="people-list">
            <!-- The PersonCardMini will be injected here by JavaScript -->
          </div>
        </section>
        <section id="bachelor-students">
          <h2 data-lang-key="bachelor-students"></h2>
          <div id="bachelor-list" class="people-list">
            <!-- The PersonCardMini will be injected here by JavaScript -->
          </div>
        </section>
        <section id="robots">
          <h2 data-lang-key="robots"></h2>
          <div id="robot-list" class="people-list">
            <!-- The PersonCardMini will be injected here by JavaScript -->
          </div>
        </section>
      </div>
      <div id="person-modal">
        <div class="person-card">
          <!-- The contents will be injected by JavaScript -->
          <div class="person-card-mini">
            <div class="person-card-mini__avatar">
              <img src="" />
            </div>
            <div class="person-card-mini__name"></div>
            <div class="person-card-mini__details">
              <div class="person-card-mini__position"></div>
              <div class="person-card-mini__lab"></div>
            </div>
          </div>
          <div class="person-card__details">
            <div class="person-card__research">
              <h3 data-lang-key="person-card.research-topics"></h3>
            </div>
            <div class="person-card__skills">
              <h3 data-lang-key="person-card.skills"></h3>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script type="importmap">
      {
        "imports": {
          "papaparse": "./js/lib/papaparse.esm.js"
        }
      }
    </script>
    <script type="module" src="./js/people.js"></script>
    <script type="module" src="./js/lang.js"></script>
  </body>
</html>
